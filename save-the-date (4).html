.clip-top,.clip-bottom{
position:fixed;
left:0;right:0;
background:#fff;
z-index:9;
}
.clip-top{top:0;height:28px;background:linear-gradient(to bottom,#fff 40%,transparent)}
.clip-bottom{bottom:0;height:28px;background:linear-gradient(to top,#fff 40%,transparent)}
.clip-left,.clip-right{
position:fixed;
top:0;bottom:0;
background:#fff;
z-index:9;
width:20px;
}
.clip-left{left:0}
.clip-right{right:0}
.page-bg{
position:fixed;
inset:0;
background:rgba(255,255,255,0.88);
z-index:0;
}
.page{
position:relative;
z-index:1;
max-width:480px;
margin:0 auto;
padding:40px 20px 48px;
position:relative;
}
.border-outer{
position:fixed;
inset:8px;
border:1px solid var(--sage);
border-radius:12px;
pointer-events:none;
z-index:10;
}
.border-inner{
position:fixed;
inset:14px;
border:1px solid var(--sage-light);
border-radius:8px;
pointer-events:none;
z-index:10;
}

/* Botanical SVG corners */
.corner{position:fixed;z-index:11;pointer-events:none;opacity:0.5}
.corner-tl{top:6px;left:6px}
.corner-tr{top:6px;right:6px;transform:scaleX(-1)}
.corner-bl{bottom:6px;left:6px;transform:scaleY(-1)}
.corner-br{bottom:6px;right:6px;transform:scale(-1,-1)}

/* Hero section */
.hero{
text-align:center;
padding:40px 0 20px;
}
.save-tag{
font-family:'Caveat',cursive;
font-size:18px;
color:var(--sage);
letter-spacing:1px;
margin-bottom:8px;
}
.names{
font-family:'Caveat',cursive;
font-size:52px;
color:var(--fern);
line-height:1.05;
margin-bottom:4px;
}
.ampersand{
font-family:'Cormorant Garamond',serif;
font-size:22px;
color:var(--sage);
font-style:italic;
margin:4px 0;
}

/* Photo */
.photo-frame{
width:calc(100% - 40px);
margin:24px auto;
border-radius:8px;
overflow:hidden;
border:1px solid var(--sage-light);
position:relative;
}
.photo-frame img{
width:100%;
display:block;
aspect-ratio:4/3;
object-fit:cover;
}

/* Divider */
.divider{
display:flex;
align-items:center;
gap:12px;
margin:28px auto;
width:80%;
}
.divider-line{
flex:1;
height:1px;
background:var(--sage);
opacity:0.4;
}
.divider-leaf{
width:24px;
height:24px;
}

/* Info section */
.info{
text-align:center;
padding:0 20px;
}
.date-main{
font-family:'Caveat',cursive;
font-size:28px;
color:var(--fern);
margin-bottom:6px;
}
.location{
font-size:17px;
font-style:italic;
color:var(--sage);
margin-bottom:4px;
line-height:1.5;
}
.details{
font-size:15px;
color:var(--sage);
line-height:1.7;
margin-top:16px;
}
.schedule-item{
margin:12px 0;
padding:12px 0;
border-bottom:1px solid var(--sage-light);
}
.schedule-item:last-child{border-bottom:none}
.schedule-time{
font-family:'Caveat',cursive;
font-size:22px;
color:var(--fern);
}
.schedule-desc{
font-size:15px;
color:var(--sage);
font-style:italic;
margin-top:2px;
}

/* Footer */
.footer{
text-align:center;
margin-top:40px;
padding-top:20px;
}
.footer-text{
font-family:'Caveat',cursive;
font-size:20px;
color:var(--sage);
}
.footer-sub{
font-size:13px;
color:var(--sage);
opacity:0.6;
margin-top:8px;
font-style:italic;
}

/* Botanical illustrations */
.botanical{
position:relative;
width:100%;
display:flex;
justify-content:center;
margin:8px 0;
opacity:0.45;
}

/* Animations */
@keyframes fadeUp{
from{opacity:0;transform:translateY(16px)}
to{opacity:1;transform:translateY(0)}
}
.fade{
opacity:0;
animation:fadeUp 0.8s ease forwards;
}
.fade-d1{animation-delay:0.15s}
.fade-d2{animation-delay:0.3s}
.fade-d3{animation-delay:0.5s}
.fade-d4{animation-delay:0.7s}
.fade-d5{animation-delay:0.9s}

@media(prefers-reduced-motion:reduce){
.fade{animation:none;opacity:1}
}

/* Responsive */
@media(min-width:600px){
.page{padding:48px 40px 64px}
.names{font-size:64px}
}
</style>
</head>
